# Publishes the React frontend to GitHub Pages on every push to master.
#
# The backend is NOT deployed by this workflow. The public site is the marketing
# pages; anything that calls /api (sign in, request access) will fail until a
# backend exists at a reachable origin.
name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages serves static files, so a deep link like /login has no file to
      # match and 404s. GitHub serves 404.html for any unmatched path, so an
      # identical copy of index.html there hands the URL to the router instead.
      - run: cp dist/index.html dist/404.html

      # Stops Jekyll stripping files and folders that begin with an underscore.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
